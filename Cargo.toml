[workspace]
# The pallet format's decode side is its own crate so firmware and the engine
# can share one reader rather than maintaining two that must stay
# bit-compatible forever (#53).
members = ["crates/pallet-format", "test", "tests-runtime"]

[package]
name = "stormblock"
version = "20.0.0"
edition = "2021"
authors = ["Glenn West"]
description = "Pure Rust enterprise block storage engine — NVMe-oF/TCP + iSCSI targets with software RAID"
repository = "https://github.com/glennswest/stormblock"
license = "TBD"
rust-version = "1.75"
# One in-process integration-test binary (tests/it), not one per file (#209).
autotests = false

[lib]
name = "stormblock"
path = "src/lib.rs"

[[bin]]
name = "stormblock"
path = "src/main.rs"

[dependencies]
# Async runtime
# `taskdump` (with --cfg tokio_unstable, .cargo/config.toml): where every task
# is parked, for /debug/tasks when the API stops answering (#269).
tokio = { version = "1", features = ["full", "taskdump"] }

# Consensus (cluster mode)
openraft = { version = "0.9", features = ["serde"], optional = true }

# HTTP client (StormFS registration, cluster join)
socket2 = { version = "0.6", features = ["all"] }

# Management API
axum = "0.8"
# Serving: streaming request/response bodies for tar and raw import, and
# verifying an imported image where it lands rather than only where it was
# built.
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.10"
# Ed25519 pallet signatures, signed and verified on the host (#378). Already
# compiled for rustls; a direct dependency adds no crate.
ring = "0.17"
hex = "0.4"
hyper = "1"
tower = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
toml = { package = "basic-toml", version = "0.1" }
serde_json = "1"

# CLI
# `env` for `#[arg(env = ...)]`. It was reaching main.rs by feature unification
# through a default-only dependency, so the RouterOS profile
# (--no-default-features) was the one build that saw the truth and did not
# compile.
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"

# The pallet on-disk format, read side — no_std, no I/O, no write path. The
# writer in src/pallet/format.rs lays bytes down at the offsets this crate
# defines, so emission has one implementation and the offsets have one
# definition. stormuefi links the same crate for x86_64-unknown-uefi (#53).
stormblock-pallet-format = { path = "crates/pallet-format", features = ["serde"] }

# Data integrity
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# System (cross-platform)
libc = "0.2"
bitvec = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Filesystem creation and checking for preformatted templates (#38, #39).
# A from-scratch async mke2fs/e2fsck: the engine formats its own thin volumes
# through the BlockDevice seam, with no loopback, no /dev node and no mkfs.ext4
# subprocess. Taken by git rather than path so a checkout of this repo alone
# still builds.
# Pinned to the same tag fio-ext4 depends on, so cargo resolves one copy and
# the two crates agree on the BlockDevice trait.
# `features = ["std"]` is required as of mkfs-ext4 2.0.0: `std` became a default
# feature so a UEFI driver can link the crate's synchronous read path, so
# `default-features = false` now leaves the `no_std` core rather than the whole
# crate.
mkfs-ext4 = { git = "https://github.com/glennswest/mkfs.ext4.rs", tag = "v3.0.0", default-features = false, features = ["std"] }

# Userspace file I/O into those filesystems — writing a template's contents
# with no mount, no loop device and no attach.
fio-ext4 = { git = "https://github.com/glennswest/fio.ext4.rs", tag = "v1.7.0", default-features = false }

# XFS beside ext4 (#147): a `mkfs.xfs`-identical formatter and a read-only
# walker for XFS images (RHEL, Rocky, Alma roots). Separate crates with
# separate device traits; `fs::xfs::XfsDevice` implements both.
mkfs-xfs = { git = "https://github.com/glennswest/mkfs.xfs.rs", tag = "v0.2.0", default-features = false }
fio-xfs = { git = "https://github.com/glennswest/fio.xfs.rs", tag = "v0.3.0", default-features = false }

# Async utilities
async-trait = "0.1"
futures = "0.3"
pin-project-lite = "0.2"

# Target protocols (iSCSI CHAP, PDU buffers)
bytes = "1"
md-5 = "0.10"
rand = "0.8"
base64 = "0.22"

# TLS (management API)
# One TLS crypto backend, ring (#209). rustls's default also pulled aws-lc-rs,
# whose aws-lc-sys is a large cmake C build compiled on every clean build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
# The same crate rustls verifies with (already in the tree): a client
# certificate checked against one CA alone, with a CRL (#379).
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto", "client", "client-legacy"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
http-body-util = "0.1"
# qcow2 clusters and VMDK grains are deflate/zlib; the Rust backend is
# miniz_oxide + crc32fast, no C.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
webpki-roots = "1"

# Web UI (optional)
askama = { version = "0.12", optional = true }
rust-embed = { version = "8", features = ["compression"], optional = true }
mime_guess = { version = "2", optional = true }

# Linux-only dependencies
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
nix = { version = "0.29", features = ["fs", "ioctl"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[features]
# `ui` is off by default (#79): the engine serves an API; stormview is the
# UI. `--features ui` puts the embedded pages back.
# `cluster` is opt-in (#209): stormblock is a standalone single-node engine
# first (CLAUDE.md), no stormcos node enables Raft, and the feature pulled
# openraft, chrono, rust_decimal, borsh and thiserror 1.x into every build.
# Build with `--features cluster` for it.
default = ["nvmeof", "iscsi", "stormfs-data"]
nvmeof = []
iscsi = []
# The StormFS data-path surface: chunk lifecycle, versioned-map commits and
# version pins (#49, #50). Off in the `mikrotik` profile, which reaches this
# by building --no-default-features: a RouterOS node with 256 MB serves
# container volumes over NVMe-TCP, it is not a StormFS data node, so the
# surface would be weight in the binary and an invitation to call something
# that node should not serve.
# The registration client in src/stormfs.rs is not gated — announcing this
# node's volumes to a metadata server is the opposite direction and costs a
# periodic POST.
stormfs-data = []
cluster = ["dep:openraft"]
ui = ["dep:askama", "dep:rust-embed", "dep:mime_guess"]
arm64 = []
mikrotik = []

[dev-dependencies]
# Integration tests read engine-written pallets through the firmware path.
stormblock-pallet-format = { path = "crates/pallet-format" }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
# Tests drive the HTTP surface with reqwest; the binary does not carry it.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# The in-process integration tests: one binary, run with cargo-nextest so each
# test still gets its own process. Runtime tests are in tests-runtime/.
[[test]]
name = "it"
path = "tests/it/main.rs"

[[bench]]
name = "parity"
harness = false
[[bench]]
name = "extent"
harness = false
[[bench]]
name = "pdu_parsing"
harness = false

# Build settings (#209). The edit/test loop keeps file:line in backtraces but
# not full debug info: a full-debug libstormblock was 575 MB, and every test
# binary links it. Dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The everyday optimised build: thin LTO across 16 codegen units uses every
# core. Measuring performance uses this.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# What goldens ship: whole-program LTO, one codegen unit. Slow to build, so
# only the golden build uses it (`cargo build --profile dist`).
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
