[package]
name = "stormblock-nvmeof"
version = "0.1.0"
edition = "2021"
authors = ["Glenn West"]
description = "NVMe/TCP wire code shared by the stormblock engine, and a portable read-only boot target (macOS, Windows, Linux)"
repository = "https://github.com/glennswest/stormblock"
license = "TBD"
publish = false

[features]
default = ["cli"]
# The `stormboot-serve` command line. A program that only links the target
# (storminstall) turns default features off and takes neither clap nor the
# log subscriber.
cli = ["dep:clap", "dep:tracing-subscriber"]

[dependencies]
# Portable on purpose (#474): tokio and plain std file I/O only. No io-uring,
# nix, libc or CPU pinning: this builds for macOS and Windows as well.
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tracing = "0.1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
crc32fast = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
hex = "0.4"

[[bin]]
name = "stormboot-serve"
path = "src/bin/stormboot-serve.rs"
required-features = ["cli"]

[lints.rust]
warnings = "deny"
