[package]
name = "stormblock-runtime-tests"
version = "0.1.0"
edition = "2021"
license = "TBD"
description = "stormblock's runtime tests: they drive the built binary (STORMBLOCK_BIN), kernel devices or privileges, so they run against a built engine, not in the routine cargo test (#209)."
publish = false

# Built and run on purpose, never by the routine check:
#   cargo build --profile dist --bin stormblock
#   STORMBLOCK_BIN=target/dist/stormblock cargo test -p stormblock-runtime-tests
# The files share tests/it/common with the in-process suite through #[path].
[dev-dependencies]
stormblock = { path = ".." }
stormblock-pallet-format = { path = "../crates/pallet-format" }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
